services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/backend
      - /backend/node_modules
    env_file:
      - ./backend/.env
    ports:
      - "5174:5174"
    environment:
      MONGO_URI: mongodb://mongodb:27017/react_books
    depends_on:
      - mongodb  
  mongodb:
    image: mongo:8
    container_name: mongo_books
    ports:
      - "27017:27017"    
    volumes:
      - mongodb_data:/data/db    

volumes:
  mongodb_data:      