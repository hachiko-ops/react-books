services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/backend
      - /backend/node_modules
    env_file:
      - ./backend/.env
    ports:
      - "5174:5174"
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/react_books?authSource=admin
    depends_on:
      - mongodb   

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes: 
      - ./frontend:/frontend
      - /frontend/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}    
    container_name: mongo_books
    ports:
      - "27017:27017"    
    volumes:
      - mongodb_data:/data/db       

volumes:
  mongodb_data:      